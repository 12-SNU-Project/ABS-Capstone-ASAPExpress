name: asap_pw

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.12
  - pip
  - numpy
  - pandas
  - pydantic
  - pyyaml
  - loguru
  - pytest
  - pip:
      # UI
      - dash
      - PySide6

      # Runtime validation / optional admin tooling
      - jsonschema
      - psycopg2-binary

      # Product page rendering and OCR
      # After environment creation, install browser binaries with:
      #   python -m playwright install chromium
      - playwright
      - dash>=4.1.0
      - opencv-python
      - paddlepaddle
      - paddleocr
      - paddlex[ocr]

      # Semantic CN candidate retrieval
      - sentence-transformers
      - torch
