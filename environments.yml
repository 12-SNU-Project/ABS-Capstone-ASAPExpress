name: asap_pw

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.12
  - pip
  - numpy
  - pandas
  - pydantic
  - pyyaml
  - requests
  - loguru
  - pytest
  - pip:
      # UI
      - dash>=4.1.0
      - dash-mantine-components
      - PySide6

      # Runtime validation / optional admin tooling
      - jsonschema
      - psycopg2-binary

      # Product page rendering and OCR
      # After environment creation, install browser binaries with:
      #   python -m playwright install chromium
      - playwright
      - opencv-python
      - paddlepaddle>=3.3,<3.4
      - paddleocr[doc-parser]>=3.7,<3.8

      # Semantic CN candidate retrieval
      - sentence-transformers
      - torch
